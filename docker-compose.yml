services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pairkit
      POSTGRES_PASSWORD: pairkit
      POSTGRES_DB: pairkit
    ports:
      - '5432:5432'
    volumes:
      - pairkit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pairkit -d pairkit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pairkit_pg:
