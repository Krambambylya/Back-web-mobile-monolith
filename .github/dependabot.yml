version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'eslint-config-expo'
          - 'react-native'
          - 'react-native-*'
          - '@react-native-*'
          - '@shopify/flash-list'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # Expo SDK 55 pins this set. 0.83 → 0.87 is semver-minor to Dependabot.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Expo pins ~5.6.2 / ~4.23.0 — 5.6→5.9 is semver-minor and fails expo-doctor.
      - dependency-name: 'react-native-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@react-native-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: '@shopify/flash-list'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Workspace override + Expo SDK 55 are 19.2.0. 19.2→19.3 is semver-minor.
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Expo doctor requires typescript ~5.9.2
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-unicorn'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
